create_pass:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: gate_pass
    label:
      example: "Paketdienst"
      selector:
        text:
    duration_hours:
      selector:
        number:
          min: 0.1
          max: 720
          step: 0.1
          unit_of_measurement: h
          mode: box
    max_uses:
      selector:
        number:
          min: 0
          max: 1000
          step: 1
          mode: box
    valid_from:
      selector:
        datetime:

list_access_points: {}

list_passes:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: gate_pass

list_activity:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: gate_pass

export_activity:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: gate_pass

clear_activity:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: gate_pass

revoke_pass:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: gate_pass
    pass_id:
      required: true
      selector:
        text:

revoke_all:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: gate_pass
