name: Publish v0.5.2

# One-time publication of the reviewed release commit. Normal future releases
# continue to use release.yml and their own version tags.
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v0.5.2.yml]

permissions:
  contents: read

concurrency:
  group: release-v0.5.2
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'JayTheG5368/gate-pass-ha' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: v0.5.2
      RELEASE_SHA: de6ba630a96a4ff5e149b3389d656a1b66afca4b
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the reviewed release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: de6ba630a96a4ff5e149b3389d656a1b66afca4b
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci

      - name: Verify source and version
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          version = os.environ["RELEASE_TAG"].removeprefix("v")
          for filename in ("custom_components/gate_pass/manifest.json", "package.json", "package-lock.json"):
              assert json.loads(Path(filename).read_text())["version"] == version, filename
          PY

      - name: Run release checks
        run: |
          python -m pytest tests -q
          python -m ruff check custom_components tests scripts
          python -m ruff format --check custom_components tests scripts
          npm run lint
          npm test
          npm audit --audit-level=high
          npm run build
          git diff --exit-code

      - name: Build archive and release notes
        run: |
          git archive --format=zip --output=gate-pass-ha-0.5.2.zip HEAD \
            custom_components/gate_pass README.md LICENSE SECURITY.md CHANGELOG.md
          python - <<'PY'
          from pathlib import Path
          notes = Path("CHANGELOG.md").read_text().split("## 0.5.2\n", 1)[1].split("\n## ", 1)[0].strip()
          notes += "\n\nFull changelog: https://github.com/JayTheG5368/gate-pass-ha/compare/v0.5.1...v0.5.2\n"
          Path("release-notes.md").write_text(notes)
          PY

      - name: Create immutable version reference and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Never move a version tag, including when retrying a partially failed run.
          if tag_object=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null); then
            tag_type=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.type')
            if [ "$tag_type" = tag ]; then
              tag_object=$(gh api "repos/$GH_REPO/git/tags/$tag_object" --jq '.object.sha')
            fi
            test "$tag_object" = "$RELEASE_SHA"
          else
            tag_object=$(gh api --method POST "repos/$GH_REPO/git/tags" \
              -f tag="$RELEASE_TAG" -f message="Gate Pass HA $RELEASE_TAG" \
              -f object="$RELEASE_SHA" -f type=commit --jq '.sha')
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$tag_object"
          fi
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$draft" = false ]; then
              gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | \
                grep -Fx 'gate-pass-ha-0.5.2.zip'
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" gate-pass-ha-0.5.2.zip --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file release-notes.md
