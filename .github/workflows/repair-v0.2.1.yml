name: Repair v0.2.1 release archive

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build clean archive from tracked files
        run: >-
          git archive --format=zip --output=gate-pass-ha-0.2.1.zip HEAD
          custom_components/gate_pass README.md LICENSE SECURITY.md CHANGELOG.md

      - name: Replace release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.2.1 gate-pass-ha-0.2.1.zip --clobber
