name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci

      - name: Verify release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest_version="$(python -c 'import json; print(json.load(open("custom_components/gate_pass/manifest.json"))["version"])')"
          package_version="$(node -p 'require("./package.json").version')"
          test "$version" = "$manifest_version"
          test "$version" = "$package_version"

      - name: Run release checks
        run: |
          python -m pytest tests -q
          python -m ruff check custom_components tests scripts
          npm run lint
          npm run build
          git diff --exit-code -- custom_components/gate_pass/frontend/gate-pass-card.js

      - name: Build manual installation archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=zip --output="gate-pass-ha-${version}.zip" HEAD \
            custom_components/gate_pass \
            README.md LICENSE SECURITY.md CHANGELOG.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "gate-pass-ha-${GITHUB_REF_NAME#v}.zip"
          --verify-tag
          --generate-notes
          --title "${GITHUB_REF_NAME}"
